name: Build Mr Mistrious Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Structure
        run: |
          android create project --target android-33 --name MrMistrious --path . --activity MainActivity --package com.mrmistrious.app

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon || echo "Using standard build flow"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Mistrious-Android-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

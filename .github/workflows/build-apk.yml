name: Build Mr Mistrious Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip -o MrMistrious-Professional-Android-Project.zip -d extracted

      - name: Find project directory
        id: project
        run: |
          PROJECT_DIR=$(find extracted -type f -name settings.gradle -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Mistrious-Android-APK
          path: extracted/MrMistrious_Professional/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

        


      

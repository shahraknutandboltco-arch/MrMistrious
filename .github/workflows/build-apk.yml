name: Build Mr Mistrious Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q MrMistrious-Professional-Android-Project.zip -d extracted

      - name: Build Debug APK
        run: |
          # پیدا کردن خودکار پوشه‌ای که فایل gradlew داخل آن قرار دارد
          GRADLEW_PATH=$(find extracted -name "gradlew" -print -quit)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Mistrious-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
